# Read the Docs configuration for taskjuggler-lsp.
# https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  apt_packages:
    - doxygen
    - graphviz
  jobs:
    pre_build:
      - doxygen Doxyfile

sphinx:
  configuration: doc/conf.py

python:
  install:
    - requirements: doc/requirements.txt
